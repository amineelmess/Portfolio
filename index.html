  <div class="layout">

      <h1 class="sidebar__name" id="sidebar-name"></h1>
      <p class="sidebar__identity" id="sidebar-identity"></p>

    <main class="terminal" id="terminal">
    <div class="terminal__header">
      <span class="terminal__title" id="window-title"></span>
      <span class="terminal__hint">try the terminal — or just use the links on the left.</span>
    </div>

    <div class="terminal__body" id="screen">
      <div id="history"></div>

      <div class="input-line" id="input-line" hidden>
        <span class="prompt" id="prompt"></span>
        <span class="cmdline"><span class="input-text" id="input-text"></span><span class="cursor" id="cursor" aria-hidden="true"></span><span class="ghost" id="ghost" aria-hidden="true"></span></span>
      </div>
    </div>

    <input
      type="text"
      id="hidden-input"
      class="hidden-input"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      aria-label="terminal input"
    />
    </main>
  </div>
